# DRAFT BINDING / NOT REVIEWED FOR EXECUTION. No Endpoint authorization.
# P2-JOURNEYS-0.4: JRN-TC-027 M01/M03-M09; OD-003 and qualified Q3/Q7/Q9-Q13.
