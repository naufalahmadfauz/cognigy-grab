schema_version: 1
id: P2-TC-027-001
version: "0.1.0"
description: Draft original GM upfront dual goal with App-to-computer-Portal transition, blank status, Portal review-request submission, qualified no-photo control and explicit finish.
product: GrabMart
country: MY
concepts:
  computer_portal: ['\b(?:grabmerchant\s+)?portal\b[^.!?\n;]{0,50}\bcomputer\b', '\bcomputer\b[^.!?\n;]{0,50}\b(?:grabmerchant\s+)?portal\b']
  status_purpose: ['\b(?:check|view|see|find)\b[^.!?\n;]{0,45}\bcompensation\s+status\b']
  readiness_question: ['\b(?:can|are)\s+you\b[^.!?\n]{0,65}\b(?:access|open|ready|signed\s+in)\b[^.!?\n]{0,65}\b(?:portal|computer)\b[^.!?\n]*\?', '\b(?:let\s+me\s+know|tell\s+me|confirm)\s+(?:when|once)\b[^.!?\n]{0,70}\b(?:portal|signed\s+in|ready)\b']
  finance: ['\b(?:open|select|choose|click(?:\s+on)?|tap(?:\s+on)?|go\s+to|navigate\s+to)\s+(?:the\s+)?finance\b']
