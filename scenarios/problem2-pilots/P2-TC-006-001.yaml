  guidance_offer: ['\b(?:would|do)\s+you\s+(?:like|want)\b[^.!?\n]{0,85}\b(?:guide|help|check)\b[^.!?\n]{0,60}\b(?:status|cancelled\s+order)\b[^.!?\n]*\?']
  preferences_question: ['\b(?:which|what)\b[^.!?\n]{0,40}\b(?:platform|guidance\s+style)\b[^.!?\n]*\?', '\bloudspeaker\b[^.!?\n]*\?']
  orders: ['\b(?:open|tap|select|choose|go\s+to)\s+(?:the\s+)?orders\b']
  cancelled: ['\b(?:open|tap|select|choose|go\s+to)\s+(?:the\s+)?cancelled\b']
  order_question: ['\b(?:can|do)\s+you\s+see\b[^.!?\n]{0,65}\b(?:relevant|cancelled|your|the)\s+order\b[^.!?\n]*\?', '\bis\s+(?:the|your)\s+(?:cancelled\s+)?order\b[^.!?\n]{0,35}\bvisible\b[^.!?\n]*\?']
  open_order: ['\b(?:open|tap|select|choose)\s+(?:the|your|that|this)\s+(?:(?:relevant|cancelled)\s+)?order\b']
  status_question: ['\b(?:what|which)\s+(?:compensation\s+)?status\b[^.!?\n]*\?', '\b(?:tell\s+me|read\s+out)\b[^.!?\n]{0,65}\bcompensation\s+status\b']
  request: ['\b(?:tap|click|open|select|choose)\s+(?:the\s+)?["\x27]?request\s+for\s+compensation\b']
  article: ['\b(?:tap|click|open|select|choose)\s+(?:the\s+)?["\x27]?report\s+a\s+payment\s+dispute\b']
  scroll: ['\bscroll\s+(?:down|through|to)\b']
  form_question: ['\b(?:can|do)\s+you\s+see\s+(?:the\s+)?(?:(?:request|compensation)\s+)?form\b[^.!?\n]*\?', '\bis\s+(?:the\s+)?(?:(?:request|compensation)\s+)?form\b[^.!?\n]{0,35}\b(?:visible|displayed)\b[^.!?\n]*\?']
  owner: ['\bowner\b']
  manager: ['\bmanager\b']
