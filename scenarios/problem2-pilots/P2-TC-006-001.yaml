schema_version: 1
id: P2-TC-006-001
version: "0.1.0"
description: Draft original GF elicited older status/request journey with form absent, authorized access clarified, retry explicitly declined, then explicit finish; no submission or transfer.
product: GrabFood
country: MY
concepts:
