  order_origin: ['\bafter\s+(?:the|your)\s+order\s+was\s+(?:made|placed)\b']
  payout: ['\bnext\s+(?:regular\s+)?(?:payout|payment)\s+cycle\b']
  policy: ['\b(?:subject\s+to|under|according\s+to)\b[^.!?\n;]{0,50}\b(?:policy|guidelines)\b']
