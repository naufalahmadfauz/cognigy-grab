# Fresh English utterance-first REST/text conversation; do not reuse TC-001's session or education.
# Versioned preparation reference 2026-11-06, Asia/Kuala_Lumpur (UTC+08:00); catalog 2026-11-04 remains historical.
# Record actual initialization before execution; age 1 day is recent on every GF weekday. No injected clock.
# Preparation, eligibility, approval, overdue payment, access and UI visibility are unknown; no navigation is accepted.
# Manual business review: full opening/disclosure once; qualified approval then regular payout; recent photo/later-review reminder.
# M03 must conditionally explain the App review-request option without inferring eligibility from link presence/absence, then offer guidance and wait.
# The later-review threshold is not a waiting rule for asking the hypothetical question; no invented payout or bank-credit date.
# M04 respects the guidance refusal and asks further help; only the later finish permits M05. Decline is not finish or payment resolution.
# Semantic screens allow paraphrase; CT01/CT02/CT12 remain source references, not a new exact-string oracle.
# No gates: hypothetical follow-up and self-contained refusal assert no prior completion. Missing education/offer still fails assessment and cannot manufacture coverage.
# Flow-owned goodbye/end_call/terminal exactly once and any voice/native-empty claims need separate evidence; REST text cannot establish them.
schema_version: 1
id: P2-TC-002-001
version: "0.1.0"
description: TC-002 recent GrabFood education, hypothetical nonreceipt follow-up, guidance refusal, further-help wait and separate explicit finish; utterance-first REST/text candidate.
product: GrabFood
country: MY
concepts:
  greeting:
    - '(?:^|[.!?]\s+|\n)\s*(?:hi|hello|hey|good\s+(?:morning|afternoon|evening))\b'
  assistant_identity:
    - '\bgrab\s+(?:ai|virtual|automated)\s+assistant\b'
    - '\b(?:ai|virtual|automated)\s+assistant\b[^.!?\n]{0,40}\bgrab\b'
  recording_notice:
    - '\b(?:call|conversation)\b[^.!?\n]{0,55}\brecord(?:ed|ing)\b'
    - '\brecording\b[^.!?\n]{0,35}\b(?:call|conversation)\b'
  recording_purpose:
    - '\bquality(?:\s+assurance)?\b[^.!?\n]{0,45}\btraining\b'
    - '\btraining\b[^.!?\n]{0,45}\bquality(?:\s+assurance)?\b'
  approval_1_2:
    - '\bapprov\w*\b[^.!?\n]{0,100}\b(?:1|one)\s*(?:-|to|or)\s*(?:2|two)\s+(?:business|working)\s+days?\b'
    - '\b(?:1|one)\s*(?:-|to|or)\s*(?:2|two)\s+(?:business|working)\s+days?\b[^.!?\n]{0,80}\bapprov\w*\b'
  usual:
    - '\b(?:usual(?:ly)?|typical(?:ly)?|generally|normal(?:ly)?)\b'
  order_origin:
    - '\b(?:after|from)\b[^.!?\n]{0,35}\border\b[^.!?\n]{0,30}\b(?:made|placed|created)\b'
    - '\b(?:after|from)\s+(?:the\s+)?order\s+(?:date|placement|creation)\b'
  regular_payout:
    - '\bnext\s+(?:(?:regular|scheduled|normal)\s+)?(?:payout|payment)\s+cycle\b'
    - '\bnext\s+(?:regular|scheduled|normal)\s+(?:payout|payment)\b'
  policy_qualification:
    - '\b(?:subject\s+to|under|according\s+to|depending\s+on)\b[^.!?\n]{0,65}\b(?:polic(?:y|ies)|guidelines)\b'
  prepared_food_photo:
    - '\b(?:keep|retain|save|take|have)\b[^.!?\n]{0,65}\b(?:photo(?:graph)?s?|pictures?|images?)\b[^.!?\n]{0,45}\bprepared\s+food\b'
    - '\b(?:keep|retain|save|take|have)\b[^.!?\n]{0,65}\bprepared\s+food\s+(?:photo(?:graph)?s?|pictures?|images?)\b'
  later_review:
    - '\b(?:review|support)\b[^.!?\n]{0,120}\b(?:more\s+than|longer\s+than|over|beyond)\s+(?:2|two)\s+(?:business|working)\s+days?\b'
    - '\b(?:more\s+than|longer\s+than|over|beyond)\s+(?:2|two)\s+(?:business|working)\s+days?\b[^.!?\n]{0,120}\b(?:review|support)\b'
  further_help:
    - '\b(?:anything|something)\s+else\b[^.!?\n]{0,90}\?'
    - '\b(?:do\s+you\s+need|would\s+you\s+like|can\s+i\s+(?:offer|provide))\s+(?:any\s+)?(?:further|more|other)\s+(?:help|assistance)\b[^.!?\n]{0,60}\?'
    - '\b(?:any|do\s+you\s+have\s+any)\s+other\s+questions\b[^.!?\n]{0,40}\?'
    - '\bhow\s+else\s+(?:can|may)\s+i\s+(?:help|assist)\b[^.!?\n]{0,60}\?'
  review_option:
    - '\b(?:submit|send|raise|make|file)\b[^.!?\n]{0,65}\brequest\b[^.!?\n]{0,90}\b(?:review|support)\b'
    - '\b(?:request|seek|ask\s+for)\b[^.!?\n]{0,65}\b(?:review|support)\b'
  guidance_offer:
    - '\b(?:would|do)\s+you\s+(?:like|want)\b[^.!?\n]{0,120}\b(?:guid(?:e|ed|ance|ing)|walk|show)\b[^.!?\n]{0,70}\?'
    - '\b(?:may|can|could|shall)\s+i\b[^.!?\n]{0,100}\b(?:guid(?:e|ed|ance|ing)|walk|show)\b[^.!?\n]{0,90}\?'
    - '\b(?:(?:would|do)\s+you\s+(?:like|want)|(?:may|can|could|shall)\s+i)\b[^.!?\n]{0,80}\b(?:help|assist(?:ance)?)\b[^.!?\n]{0,90}\b(?:cancell?ed\s+orders?|compensation\s+status|check(?:ing)?|find(?:ing)?|locat(?:e|ing)|open(?:ing)?|navigat(?:e|ing)|submit(?:ting)?|request)\b[^.!?\n]{0,60}\?'
  navigation_instruction:
    - '(?:^|[.!?;]\s+|\n)\s*(?:please\s+)?(?:(?:first|next|now)\s*[,;:]?\s*)?(?:open|tap(?:\s+on)?|click(?:\s+on)?|select|go\s+to|navigate\s+to|log\s+in\s+to)\s+(?:the\s+)?(?:grab\s*merchant\s+(?:app|portal)|orders|cancelled|history|help\s+centre|request\s+for\s+compensation|report\s+a\s+payment\s+dispute)\b'
  unsupported_claim:
    - '\b(?:guaranteed|definitely)\b[^.!?\n;]{0,60}\b(?:approved|paid|compensated|eligible|accepted)\b'
    - '\byour\s+(?:order|request|compensation)\s+(?:is|has\s+been|will\s+be)\s+(?:already\s+)?(?:approved|paid|guaranteed)\b'
    - '\b(?:since|as|because)\s+you(?:\s+have|\s+had|\x27ve|\x27d)?\s+(?:already\s+)?prepared\b'
    - '\b(?:your|the|this)\s+(?:order|food)\s+(?:was|is|has\s+been|had\s+been)\s+(?:already\s+)?prepared\b'
  handoff:
    - '\b(?:connect|transfer)\s+you\b'
  extra_intake:
    - '\bhow\s+(?:may|can)\s+i\s+(?:help|assist)\s+you(?:\s+today)?\s*\?'
    - '\b(?:app\s+or\s+(?:the\s+)?portal|one.by.one\s+or\s+all.at.once|loudspeaker)\b[^.!?\n]{0,70}\?'
  goodbye:
    - '\b(?:goodbye|bye|(?:thank\s+you|thanks)\s+for\s+(?:calling|contacting)|have\s+a\s+(?:nice|good|great|pleasant)\s+day|take\s+care)\b'
concept_exclusions:
  unsupported_claim:
    - '\b(?:if|unless|whether|not|never)\b[^.!?\n;]*\bprepared\b'
    - '\b(?:if|once|when|whether)\s+(?:the|your)\s+(?:order|request|compensation)\s+(?:is|has\s+been)\s+approved\b'
    - '\b(?:not|never|no|cannot|can\x27t)\b[^.!?\n;]*\b(?:guaranteed|definitely|approved|paid|compensated|eligible|accepted)\b'
  handoff:
    - '\b(?:will\s+not|won\x27t|cannot|can\x27t|do\s+not|don\x27t|no\s+need\s+to)\s+(?:connect|transfer)\b[^.!?\n;]*'
assertions:
  - {id: identity, type: session_continuity, reason: Preserve the same current-order conversation across education and follow-up and the separate refusal and finish.}
  - {id: once-only-greeting, type: no_repeated_greeting, concepts: [greeting], reason: Apply the outstanding opening once without restarting it on continuation.}
  - {id: no-unconsented-actions-or-claims, type: forbidden, concepts: [navigation_instruction, unsupported_claim, handoff], reason: No guidance is accepted and no preparation or award or transfer condition is established; conditional review information is not permission to start navigation.}
turns:
  - id: recent-age-only
    merchant: "I'm a GrabFood merchant in Malaysia. The order was cancelled 1 day ago."
    assertions:
      - {id: applicable-opening, type: required, concepts: [greeting, assistant_identity, recording_notice, recording_purpose], reason: M01 utterance-first fallback supplies the outstanding greeting and recording disclosure once.}
      - {id: recent-education-and-help-question, type: required, concepts: [approval_1_2, usual, order_origin, regular_payout, policy_qualification, prepared_food_photo, later_review, further_help], reason: M02 deliver qualified recent GF education and evidence reminder then ask further help and wait; this is not borrowed TC-001 evidence.}
      - {id: no-premature-offer-intake-or-close, type: forbidden, concepts: [guidance_offer, extra_intake, goodbye], reason: Recent age-only entry needs education without unsolicited guidance or preference intake or a close before the merchant answers.}
  - id: hypothetical-nonreceipt
    merchant: "What if I don't receive compensation for this same cancelled order?"
    assertions:
      - {id: conditional-review-information-and-offer, type: required, concepts: [review_option, guidance_offer], reason: M03 screen review-request information and a task-specific guidance offer; human review must establish the supported App option and conditional meaning without eligibility inference from menu visibility and an actual wait.}
      - {id: no-close-on-follow-up, type: forbidden, concepts: [goodbye], reason: The hypothetical concern is not a finish signal or an established approval or overdue payment.}
  - id: decline-guidance
    merchant: "No, thank you. I don't want to be guided to the cancelled order. I understand."
    assertions:
      - {id: further-help-after-decline, type: required, concepts: [further_help], reason: M04 respect the guidance refusal then ask further help and wait for a distinct answer.}
      - {id: no-reoffer-or-close-on-decline, type: forbidden, concepts: [guidance_offer, goodbye], reason: Declining guidance is not a finish signal and does not authorize repeating the same offer.}
  - id: explicit-finish
    merchant: "No, that's all. I don't need any more help. Thank you."
    assertions:
      - {id: normal-closing-text, type: required, concepts: [goodbye], reason: M05 screen ordinary goodbye text only; Flow ownership and terminal exactly once require external evidence.}
      - {id: no-restart-after-finish, type: forbidden, concepts: [guidance_offer, extra_intake, further_help, approval_1_2], reason: Honor the separate explicit finish without restarting guidance or intake or education or another help question.}
