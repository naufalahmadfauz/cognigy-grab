# OFFLINE FIXTURE CANDIDATE. No new live execution is authorized.
# P2-JOURNEYS-0.4: JRN-TC-003 M01/M03-M10; OD002-REVIEW-0.2 situation A.
# Preserve v0.1.0/v0.1.1/v0.1.2 and their evidence. Same 14 checkpoints; T07 clarifies the unopened article.
# Gates screen bounded English wording, not unrestricted semantics or final business verdicts.
# Utterance-first App; synthetic authorized Owner, blank status, visible form, GF no-photo inputs.
# Cancellation age 14 days; reference date remains external metadata. No clock injection.
# Open order -> wait -> status observation request -> wait -> conditional review request.
schema_version: 1
id: P2-TC-003-001
version: "0.1.3"
description: Offline hardened GF App candidate; bounded observation/report paraphrases, separate order-opening and status waits, qualified no-photo continuation and merchant-owned submission.
product: GrabFood
country: MY
concepts:
  orders: ['\b(?:open|tap(?:\s+on)?|click(?:\s+on)?|select|choose|go\s+(?:to|into)|navigate\s+to)\s+(?:the\s+)?["\x27“]?orders\b']
  cancelled: ['\b(?:open|tap(?:\s+on)?|click(?:\s+on)?|select|choose|go\s+(?:to|into)|navigate\s+to)\s+(?:the\s+)?["\x27“]?cancelled\b(?!\s+order\b)']
  order_question:
    - '\b(?:can|do)\s+you\s+(?:see|find|locate)\s+(?:the|your|that|this)\s+(?:relevant\s+)?(?:cancell?ed\s+)?order\b[^.!?\n]{0,70}\?'
    - '\b(?:is|does)\s+(?:the|your|that|this)\s+(?:relevant\s+)?(?:cancell?ed\s+)?order\b[^.!?\n]{0,40}\b(?:visible|appear|listed|show)\w*\b[^.!?\n]{0,40}\?'
    - '\b(?:tell\s+me|let\s+me\s+know|confirm)\s+(?:if|whether)\s+(?:you\s+can\s+(?:see|find|locate)\s+(?:the|your|that|this)\s+(?:relevant\s+)?(?:cancell?ed\s+)?order|(?:the|your|that|this)\s+(?:relevant\s+)?(?:cancell?ed\s+)?order\s+(?:is\s+(?:visible|listed)|appears?))\b'
  open_order: ['\b(?:open|tap(?:\s+on)?|click(?:\s+on)?|select|choose)\s+(?:the|your|that|this)\s+(?:relevant\s+)?(?:cancell?ed\s+)?order\b']
  status_question:
    - '\b(?:what|which)\s+(?:compensation\s+)?status\s+(?:(?:is\s+)?(?:shown|displayed|listed|visible)|do\s+you\s+see)\b[^.!?\n]{0,80}\?'
    - '\bwhat\s+(?:does\s+(?:the\s+)?compensation\s+status\s+(?:say|show)|is\s+(?:the\s+)?compensation\s+status\s+(?:shown|displayed|listed|on|for))\b[^.!?\n]{0,80}\?'
    - '\b(?:tell\s+me|let\s+me\s+know|read\s+out|report)\s+(?:(?:the|your)\s+)?compensation\s+status\b(?:\s+(?:shown|displayed|listed|visible|for|on|in)\b[^.!?\n]{0,70})?\s*(?:[.!?]|$)'
    - '\b(?:tell\s+me|let\s+me\s+know|report)\s+(?:what|which)\s+(?:(?:the|your)\s+)?compensation\s+status\s+(?:says|shows|is\s+(?:shown|displayed|listed)|you\s+(?:see|read))\b'
    - '\b(?:check|look\s+at|read)\s+(?:the\s+|your\s+)?compensation\s+status\b[^.!?\n]{0,90}(?:[.;]\s*|\s+)(?:and\s+)?(?:please\s+)?(?:tell\s+me|let\s+me\s+know|report|read\s+out)\s+(?:what\s+(?:it|the\s+status)\s+(?:says|shows)|what\s+you\s+see|(?:the\s+)?(?:status|result))\b'
    - '\b(?:check|look\s+at|read)\s+(?:the\s+|your\s+)?compensation\s+status\b[^.!?\n]{0,90}[.;]\s*what\s+does\s+it\s+(?:say|show)\s*\?'
    - '\bread\s+(?:the\s+|your\s+)?compensation\s+status\b[^.!?\n]{0,60}\b(?:aloud|out\s+to\s+me)\b'
  status_assertion:
    - '\b(?:(?:the|your|this|that)\s+)?(?:compensation\s+)?status\s+(?:is|was|shows?|reads?)\s+(?:(?:already|definitely|certainly)\s+)?["\x27“]?(?:auto[ -]+approved|approved|paid|pending|rejected|blank|empty|not\s+(?:shown|displayed)|unavailable)\b'
    - '\b(?:assume|pretend|mark|treat)\b[^.!?\n]{0,50}\b(?:status|order)\b[^.!?\n]{0,35}\b(?:approved|paid|pending|rejected|blank|empty)\b'
    - '\b(?:i\s+(?:can\s+see|see|checked|confirmed)|our\s+system\s+(?:shows|confirms))\b[^.!?\n]{0,70}\b(?:approved|paid|pending|rejected|blank|empty)\b'
    - '\bit\s+(?:has\s+been|is|was|shows?|reads?)\s+(?:already\s+)?(?:approved|paid|pending|rejected|blank|empty|not\s+approved)\b'
    - '\b(?:compensation\s+)?status\s*:\s*["\x27“]?(?:auto[ -]+approved|approved|paid|pending|rejected|blank|empty|not\s+approved)\b'
  request: ['\b(?:tap(?:\s+on)?|click(?:\s+on)?|open|select|choose|follow)\s+(?:the\s+)?(?:(?:link|button|option)\s+(?:(?:labelled|labeled|called|for)\s+)?)?["\x27“]?request\s+for\s+compensation\b']
  article: ['\b(?:tap(?:\s+on)?|click(?:\s+on)?|open|select|choose)\s+(?:the\s+)?(?:(?:article|result|link)\s+(?:(?:titled|labelled|labeled|called)\s+)?)?["\x27“]?report\s+a\s+payment\s+dispute\b']
  scroll: ['\bscroll\s+(?:further\s+)?(?:down|through|to\s+(?:the\s+)?bottom)\b']
  form_question:
    - '\b(?:can|do)\s+you\s+(?:see|find)\s+(?:a\s+|the\s+)?(?:(?:compensation\s+)?request\s+|compensation\s+)?form\b[^.!?\n]{0,60}\?'
    - '\bis\s+(?:a\s+|the\s+)?(?:(?:compensation\s+)?request\s+|compensation\s+)?form\b[^.!?\n]{0,35}\b(?:visible|displayed|showing)\b[^.!?\n]{0,35}\?'
    - '\b(?:tell\s+me|let\s+me\s+know|confirm)\s+(?:if|whether)\s+(?:you\s+can\s+see\s+(?:a\s+|the\s+)?(?:(?:compensation\s+)?request\s+|compensation\s+)?form|(?:a\s+|the\s+)?(?:(?:compensation\s+)?request\s+|compensation\s+)?form\s+(?:is\s+(?:visible|displayed|showing)|appears?))\b'
  details:
    - '\b(?:enter|provide|complete|fill(?:\s+in|\s+out)?|type|add)\s+(?:the\s+|your\s+)?(?:required\s+)?order\s+(?:details|information)\b'
    - '\b(?:enter|provide|type|add|fill(?:\s+in|\s+out)?)\s+(?:the\s+)?(?:details|information)\s+(?:of|for|about)\s+(?:the|your|this|that)\s+order\b'
  food_photo:
    - '\b(?:attach|upload|provide|add|keep)\b[^.!?\n;]{0,50}\b(?:photos?|photographs?|pictures?|images?)\b[^.!?\n;]{0,40}\b(?:prepared\s+food|food\s+(?:(?:that|which)\s+)?(?:was\s+)?prepared)\b'
    - '\b(?:attach|upload|provide|add|keep)\b[^.!?\n;]{0,40}\bprepared\s+food\s+(?:photos?|photographs?|pictures?|images?)\b'
  wrong_photo: ['\b(?:photos?|photographs?|pictures?|images?)\b[^.!?\n;]{0,35}\bpacked\s+items\b', '\bpacked\s+items\s+(?:photos?|photographs?|pictures?|images?)\b']
  no_photo_continue:
    - '\b(?:continue|proceed|submit)\b[^.!?\n;]{0,55}\bwithout\b[^.!?\n;]{0,25}\b(?:photos?|pictures?|images?)\b'
    - '\b(?:can|may)\s+(?:still\s+)?(?:continue|proceed)\b[^.!?\n;]{0,55}\b(?:even\s+)?if\s+you\s+(?:do\s+not|don\x27t)\s+have\s+(?:a\s+|the\s+)?(?:photo|picture|image)\b'
  supporting_info:
    - '\b(?:add|provide|include|enter|use|supply)\b[^.!?\n;]{0,50}\b(?:available|supporting)\s+(?:information|details|evidence)\b'
    - '\b(?:add|provide|include|enter|use|supply)\b[^.!?\n;]{0,50}\b(?:information|details|evidence)\s+(?:you\s+(?:have|can\s+provide)|available)\b'
  submit:
    - '\b(?:submit|send)\s+(?:the\s+|your\s+|this\s+)?(?:completed\s+)?(?:form|request)\b'
    - '\b(?:submit|send)\s+it\b'
    - '\b(?:tap(?:\s+on)?|click(?:\s+on)?|press|select)\s+(?:the\s+)?["\x27“]?submit\b'
  submission_question:
    - '\b(?:let\s+me\s+know|tell\s+me|confirm)\b[^.!?\n;]{0,65}\b(?:submitted|sent)\b'
    - '\b(?:let\s+me\s+know|tell\s+me|confirm)\b[^.!?\n;]{0,50}\bsubmission\s+(?:is\s+|was\s+)?(?:complete|done|successful)\b'
    - '\b(?:have|did)\s+you\b[^.!?\n]{0,40}\b(?:submit\w*|send|sent)\b[^.!?\n]{0,40}\?'
  acknowledgement: ['\b(?:thank\s+you|thanks|noted|understood|i\s+have\s+noted|i\x27ve\s+noted)\b']
  further_help:
    - '\b(?:anything|something)\s+else\b[^.!?\n]{0,90}\?'
    - '\b(?:do\s+you\s+need|would\s+you\s+like|can\s+i\s+(?:offer|provide))\s+(?:any\s+)?(?:further|more|other)\s+(?:help|assistance)\b[^.!?\n]{0,60}\?'
    - '\b(?:any|do\s+you\s+have\s+any)\s+other\s+questions\b[^.!?\n]{0,40}\?'
    - '\blet\s+me\s+know\s+if\s+you\s+(?:need|want)\s+(?:(?:any\s+)?(?:further|more|other)\s+(?:help|assistance)|(?:anything|something)\s+else)\b'
  goodbye: &closing ['\b(?:goodbye|bye|(?:thank\s+you|thanks)\s+for\s+(?:calling|contacting)|have\s+a\s+(?:nice|good|great)\s+day|take\s+care)\b']
  handoff: ['\b(?:connect|transfer)\s+you\b', '\b(?:i\s+will|i\x27ll|let\s+me)\s+(?:connect|transfer)\b', '\b(?:would|do)\s+you\s+(?:like|want)\b[^.!?\n]{0,55}\b(?:speak|talk)\b[^.!?\n]{0,35}\b(?:person|agent|support)\b']
  agent_submission: ['\bi\s+(?:have\s+|already\s+|will\s+)?submitted\b', '\bi\x27ve\s+(?:already\s+)?submitted\b', '\bi\s+will\s+submit\b']
  award_guarantee:
    - '\b(?:guaranteed|definitely)\b[^.!?\n;]{0,50}\b(?:approved|paid|compensated|accepted)\b'
    - '\byour\s+(?:order|request|compensation)\s+(?:is|will\s+be)\s+(?:approved|paid|guaranteed)\b'
    - '\b(?:the|your|this|that)\s+(?:order|request|compensation)\s+(?:has\s+been|is|was|will\s+be)\s+(?:already\s+)?(?:auto[ -]+)?(?:approved|paid|compensated|accepted)\b'
    - '\byou\s+will\s+(?:definitely\s+)?(?:receive|get)\s+(?:the\s+|your\s+)?compensation\b'
    - '\b(?:it|compensation|(?:the\s+|your\s+)?compensation\s+status)\s+(?:has\s+been|is|was|will\s+be)\s+(?:already\s+)?(?:auto[ -]+)?(?:approved|paid|accepted)\b'
    - '\bit\x27s\s+(?:(?:already\s+)?(?:been\s+)?|been\s+already\s+)(?:auto[ -]+)?(?:approved|paid|accepted)\b'
    - '\byou\s+(?:are|have\s+been)\s+approved\s+for\s+compensation\b'
  wrong_route: ['\b(?:open|use|go\s+to|log\s+in\s+to)\s+(?:the\s+)?(?:grabmerchant\s+)?portal\b', '\b(?:open|select|tap(?:\s+on)?|click(?:\s+on)?)\s+(?:the\s+)?(?:history|finance|transactions|date\s+selector)\b']
  timeline: ['\b(?:one\s+to\s+two|1\s*-\s*2|three\s+to\s+five|3\s*-\s*5)\s+(?:business|working)\s+days\b']
  early_close: *closing
concept_exclusions:
  orders: &not_action
    - '\b(?:do\s+not|don\x27t|cannot|can\x27t|must\s+not|should\s+not|never)\s+(?:open|tap|select|choose|go|click|scroll|enter|provide|complete|fill|attach|upload|add|keep|include|submit|send|use|type|supply|follow|navigate|press)\b[^.!?\n,;]*'
    - '\b(?:no\s+need\s+to|need\s+not|(?:don\x27t|do\s+not)\s+need\s+to|avoid)\s+(?:open|tap|select|choose|go|click|scroll|enter|provide|complete|fill|attach|upload|add|keep|include|submit|send|use|type|supply|follow|navigate|press)\w*\b[^.!?\n,;]*'
  cancelled: *not_action
  open_order: *not_action
  request: *not_action
  article: *not_action
  scroll: *not_action
  details: *not_action
  food_photo: *not_action
  supporting_info: *not_action
  submit: *not_action
  order_question: &not_observation
    - '\b(?:do\s+not|don\x27t|cannot|can\x27t|must\s+not|should\s+not|never)\s+(?:check|look|read|tell|report|confirm|let)\b[^.!?\n;]*'
    - '\b(?:no\s+need\s+to|need\s+not|(?:don\x27t|do\s+not)\s+need\s+to|avoid)\s+(?:check|look|read|tell|report|confirm|let)\w*\b[^.!?\n;]*'
  status_question: *not_observation
  form_question: *not_observation
  submission_question: *not_observation
  further_help: *not_observation
  no_photo_continue: ['\b(?:cannot|can\x27t|can\s+not|may\s+not|must\s+not|should\s+not|do\s+not|don\x27t|never|no\s+need\s+to|need\s+not)\s+(?:continue|proceed|submit)\b[^.!?\n,;]*']
  handoff: ['\b(?:will\s+not|won\x27t|cannot|can\x27t|do\s+not|don\x27t)\s+(?:connect|transfer)\b[^.!?\n,;]*']
  award_guarantee:
    - '\b(?:not|never)\s+guaranteed\b[^.!?\n,;]*'
    - '\b(?:if|once|when|whether)\s+(?:the|your|this|that)\s+(?:order|request|compensation)\s+(?:is|has\s+been|was)\s+(?:auto[ -]+)?(?:approved|paid|accepted)\b'
    - '\b(?:(?:cannot|can\x27t|do\s+not|don\x27t)\s+guarantee|no\s+guarantee|does\s+not\s+guarantee)\b[^.!?\n;]{0,90}\b(?:approved|paid|accepted)\b'
    - '\b(?:if|once|when|whether)\s+(?:it|compensation|(?:the\s+|your\s+)?compensation\s+status)\s+(?:is|has\s+been|was)\s+(?:auto[ -]+)?(?:approved|paid|accepted)\b'
    - '\b(?:if|once|when|whether)\s+it\x27s\s+(?:been\s+)?(?:auto[ -]+)?(?:approved|paid|accepted)\b'
    - '\b(?:if|once|when)\s+(?:(?:the|your)\s+(?:order|request|compensation)\s+(?:is|has\s+been)\s+)?approved\s*[,]?\s+(?:then\s+)?you\s+will\s+(?:receive|get)\s+(?:the\s+|your\s+)?compensation\b'
  status_assertion:
    - '\b(?:if|whether|when|once)\s+(?:(?:the|your)\s+)?(?:compensation\s+)?status\s+(?:is|was|shows?|reads?)\s+["\x27“]?(?:approved|paid|pending|rejected|blank|empty|unavailable)\b'
    - '\b(?:if|whether|when|once)\s+it\s+(?:is|was|has\s+been|shows?|reads?)\s+(?:approved|paid|pending|rejected|blank|empty|not\s+approved)\b'
  wrong_route: *not_action
assertions:
  - {id: identity, type: session_continuity, reason: Keep one current-order conversation; product metadata alone is not merchant context.}
  - {id: no-handoff, type: forbidden, concepts: [handoff], reason: This selected successful App target has no handoff trigger or transfer consent.}
  - {id: no-agent-submission, type: forbidden, concepts: [agent_submission], reason: Only the merchant reports self-submission; never claim the Agent submitted.}
  - {id: no-guarantee, type: forbidden, concepts: [award_guarantee], reason: A review request is not accepted evidence or approved compensation.}
  - {id: app-target, type: forbidden, concepts: [wrong_route], reason: The visible-order full App target needs neither History recovery nor a Portal detour.}
  - {id: food-evidence, type: forbidden, concepts: [wrong_photo], reason: Preserve prepared-food rather than packed-items evidence.}
turns:
  - id: direct-dual-entry
    merchant: "I'm a GrabFood merchant in Malaysia. This prepared-food order was cancelled 14 days ago. Help me check its compensation status and, if still needed, submit a request for review. I'm on the GrabMerchant app home screen with authorized Owner access. Guide me one step at a time; no loudspeaker."
    advance_when: [next-step, one-action, direct-entry, no-assumed-status, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [orders], reason: M01/M03/M04 use supplied context and start with Orders.}
      - {id: one-action, type: forbidden, concepts: [cancelled, order_question, open_order, status_question, request, article, scroll, form_question, details, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Wait for Orders completion before later observations or actions.}
      - {id: direct-entry, type: forbidden, concepts: [timeline], reason: M02 has no trigger on this clear upfront dual request.}
      - &status_guard {id: no-assumed-status, type: forbidden, concepts: [status_assertion], reason: Obtain the merchant's status observation before asserting a status or inventing a result.}
  - id: orders-open
    merchant: "Orders is open. What is the next step?"
    advance_when: [next-step, one-action, no-assumed-status, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [cancelled], reason: M04 move to Cancelled after the reported action.}
      - {id: one-action, type: forbidden, concepts: [orders, order_question, open_order, status_question, request, article, scroll, form_question, details, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Wait for Cancelled before asking for order visibility.}
      - *status_guard
  - id: cancelled-open
    merchant: "Cancelled is open."
    advance_when: [next-step, one-action, no-assumed-status, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [order_question], reason: M04 ask whether the relevant order is visible; do not presume it.}
      - {id: one-action, type: forbidden, concepts: [orders, cancelled, open_order, status_question, request, article, scroll, form_question, details, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Obtain visibility before opening the order or deciding status.}
      - *status_guard
  - id: order-visible
    merchant: "I can see that cancelled order in the list."
    advance_when: [next-step, one-action, no-assumed-status, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [open_order], reason: M05 instruct opening the visible order and wait for completion before asking its compensation status.}
      - {id: one-action, type: forbidden, concepts: [orders, cancelled, order_question, status_question, request, article, scroll, form_question, details, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Wait for the merchant to confirm the order is open before the separate status inquiry or submission guidance.}
      - *status_guard
  - id: order-opened
    merchant: "The relevant cancelled order is open and its details are visible."
    advance_when: [next-step, one-action, no-assumed-status, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [status_question], reason: M05 obtain the actual compensation-status observation only after the merchant confirms opening the order.}
      - {id: one-action, type: forbidden, concepts: [orders, cancelled, order_question, open_order, request, article, scroll, form_question, details, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Wait for the reported status before any conditional review-request action; do not repeat completed navigation.}
      - *status_guard
  - id: blank-status-link-present
    merchant: "No compensation status is displayed; it is blank. I still want to submit a request for review. The Request for compensation link is visible."
    advance_when: [next-step, one-action, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [request], reason: M06/M07 use explicit blank status and retained intent to open the present App link.}
      - {id: one-action, type: forbidden, concepts: [orders, cancelled, order_question, open_order, status_question, article, scroll, form_question, details, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Wait for the link action before opening the article or claiming a form.}
  - id: request-link-opened
    merchant: "I tapped Request for compensation. I can see a link labelled 'Report a payment dispute', but I haven't opened the article yet."
    advance_when: [next-step, one-action, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [article], reason: M07 open the identified article rather than treating the link as a form.}
      - {id: one-action, type: forbidden, concepts: [orders, cancelled, order_question, open_order, status_question, request, scroll, form_question, details, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Wait for article opening before scrolling.}
  - id: article-opened
    merchant: "Report a payment dispute is open."
    advance_when: [next-step, wait-for-form, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [scroll, form_question], reason: M07 scroll and request the separate form-visibility result.}
      - {id: wait-for-form, type: forbidden, concepts: [orders, cancelled, order_question, open_order, status_question, request, article, details, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Do not complete or submit a form before the merchant reports visibility.}
  - id: form-visible
    merchant: "I scrolled down and the request form is visible. What should I enter first?"
    advance_when: [next-step, one-action, no-handoff, no-agent-submission, no-guarantee, app-target]
    assertions:
      - {id: next-step, type: required, concepts: [details], reason: M08 start merchant-owned completion only after visible form and known authorized access.}
      - {id: one-action, type: forbidden, concepts: [orders, cancelled, order_question, open_order, status_question, request, article, scroll, form_question, food_photo, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Order-details completion precedes the next evidence action.}
  - id: details-entered
    merchant: "I entered the order details. What evidence should I provide?"
    advance_when: [next-step, one-action, no-handoff, no-agent-submission, no-guarantee, app-target, food-evidence]
    assertions:
      - {id: next-step, type: required, concepts: [food_photo], reason: M08 retain the prepared-food photo recommendation without assuming availability.}
      - {id: one-action, type: forbidden, concepts: [orders, cancelled, order_question, open_order, status_question, request, article, scroll, form_question, details, no_photo_continue, supporting_info, submit, submission_question, further_help, early_close], reason: Wait for evidence availability before the next completion action.}
  - id: no-photo
    merchant: "I don't have a photo of the prepared food. I do have the order details and supporting information. How can I continue?"
    advance_when: [next-step, one-action, no-handoff, no-agent-submission, no-guarantee, app-target, food-evidence]
    assertions:
      - {id: next-step, type: required, concepts: [no_photo_continue, supporting_info], reason: Qualified Q7 continuation uses available information without inventing substitutes or guaranteed acceptance; manual review covers qualifications.}
      - {id: one-action, type: forbidden, concepts: [orders, cancelled, order_question, open_order, status_question, request, article, scroll, form_question, details, food_photo, submit, submission_question, further_help, early_close], reason: Do not force the unavailable photo or advance to submission before information completion.}
  - id: information-entered
    merchant: "I added the available supporting information. What is the next step?"
