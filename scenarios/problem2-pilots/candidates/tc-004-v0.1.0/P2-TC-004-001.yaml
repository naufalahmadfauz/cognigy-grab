  navigation: ['(?:^|[.!?;]\s+|\n)\s*(?:please\s+)?(?:open|tap(?:\s+on)?|click(?:\s+on)?|select|go\s+to|log\s+in\s+to)\s+(?:the\s+)?(?:grab\s*merchant\s+(?:app|portal)|orders|cancelled|history|help\s+centre|request\s+for\s+compensation)\b']
  preferences: ['\b(?:app\s+or\s+(?:the\s+)?portal|one.by.one\s+or\s+all.at.once|loudspeaker)\b[^.!?\n]{0,70}\?']
  handoff: ['\b(?:connect|transfer)\s+you\b']
  guarantee: ['\b(?:guaranteed|definitely)\b[^.!?\n;]{0,60}\b(?:approved|paid|compensated|eligible|accepted)\b']
