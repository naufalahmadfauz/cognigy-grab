  usual: ['\b(?:usual(?:ly)?|typical(?:ly)?|generally|normal(?:ly)?)\b']
  origin: ['\b(?:after|from)\b[^.!?\n]{0,35}\border\b[^.!?\n]{0,30}\b(?:made|placed|created)\b', '\b(?:after|from)\s+(?:the\s+)?order\s+(?:date|placement|creation)\b']
  payout: ['\bnext\s+(?:(?:regular|scheduled|normal)\s+)?(?:payout|payment)\s+cycle\b', '\bnext\s+(?:regular|scheduled|normal)\s+(?:payout|payment)\b']
  policy: ['\b(?:subject\s+to|under|according\s+to|depending\s+on)\b[^.!?\n]{0,65}\b(?:polic(?:y|ies)|guidelines)\b']
  keep_food_photo:
    - '\b(?:keep|retain|save)\b[^.!?\n]{0,65}\b(?:photo(?:graph)?s?|pictures?|images?)\b[^.!?\n]{0,45}\bprepared\s+food\b'
    - '\b(?:keep|retain|save)\b[^.!?\n]{0,65}\bprepared\s+food\s+(?:photo(?:graph)?s?|pictures?|images?)\b'
    - '\b(?:photo(?:graph)?s?|pictures?|images?)\b[^.!?\n]{0,45}\bprepared\s+food\b[^.!?\n]{0,55}\b(?:keep|retain|save)\b'
  guidance_offer:
    - '\b(?:would|do)\s+you\s+(?:like|want)\b[^.!?\n]{0,120}\b(?:guid(?:e|ed|ance|ing)|walk|show)\b[^.!?\n]{0,70}\?'
    - '\b(?:may|can|could|shall)\s+i\b[^.!?\n]{0,100}\b(?:guid(?:e|ed|ance|ing)|walk|show)\b[^.!?\n]{0,90}\?'
    - '\b(?:would|do)\s+you\s+(?:like|want)\b[^.!?\n]{0,60}\b(?:help|assistance)\b[^.!?\n]{0,80}\b(?:check|checking|status|cancelled\s+order)\b[^.!?\n]{0,50}\?'
  further_help: ['\b(?:anything|something)\s+else\b[^.!?\n]{0,90}\?', '\b(?:do\s+you\s+need|would\s+you\s+like|can\s+i\s+(?:offer|provide))\s+(?:any\s+)?(?:further|more|other)\s+(?:help|assistance)\b[^.!?\n]{0,60}\?', '\bhow\s+else\s+(?:can|may)\s+i\s+(?:help|assist)\b[^.!?\n]{0,60}\?']
