  guarantee: ['\b(?:no|not|never|cannot|can\x27t)\b[^.!?\n;]*\b(?:guaranteed|definitely)\b']
assertions:
  - {id: identity, type: session_continuity, reason: Preserve the current-order context across inquiry and the distinct refusal and finish.}
  - {id: once-only-greeting, type: no_repeated_greeting, concepts: [greeting], reason: The outstanding opening occurs once and is not repeated on continuation.}
  - {id: no-unaccepted-guidance, type: forbidden, concepts: [navigation, preferences, handoff, guarantee], reason: This older information-only target accepts no walkthrough or preference intake or transfer and establishes no individual award.}
turns:
  - id: older-age-only
    merchant: "I'm a GrabFood merchant in Malaysia. The order was cancelled 14 days ago."
    assertions:
      - {id: opening-and-goal-question, type: required, concepts: [greeting, assistant, recording, recording_purpose, goal_question], reason: M01 reuse GF and older age then ask the missing goal and wait.}
      - {id: wait-for-goal, type: forbidden, concepts: [approval, keep_food_photo, guidance_offer, further_help, goodbye], reason: Age-only older entry is not the actual inquiry or consent or a finish signal.}
  - id: elicited-general-status-inquiry
    merchant: "I want to know about the compensation status for that order."
    assertions:
      - {id: older-education-and-offer, type: required, concepts: [approval, usual, origin, payout, policy, keep_food_photo, guidance_offer], reason: M02 qualified GF education then existing-photo reminder and one status-guidance offer; human review assesses conditional reminder meaning and ordering.}
      - {id: wait-for-offer-answer, type: forbidden, concepts: [goodbye], reason: Wait for the guidance answer instead of closing or assuming consent.}
  - id: explicit-guidance-decline
    merchant: "No, thanks. I don't want guidance; I'll check it myself."
    assertions:
      - {id: further-help-after-decline, type: required, concepts: [further_help], reason: M03 stop declined guidance then ask further help and wait for a separate answer.}
      - {id: no-reoffer-or-premature-close, type: forbidden, concepts: [guidance_offer, approval, goodbye], reason: No repeated offer or unnecessary education or goodbye on guidance refusal alone.}
  - id: explicit-finish
    merchant: "No, that's all. I don't need any more help. Thank you."
    assertions:
      - {id: normal-closing-text, type: required, concepts: [goodbye], reason: M04 screen ordinary goodbye text only; Flow-owned terminal and audible completion need external evidence.}
      - {id: no-restart, type: forbidden, concepts: [goal_question, guidance_offer, further_help, approval], reason: Respect the explicit finish without restarting the conversation.}
